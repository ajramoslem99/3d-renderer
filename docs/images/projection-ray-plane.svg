<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" fill="#f8fafc"/><text x="34" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#172033">Perspective projection is a ray intersecting an image plane</text>
<path d="M150 430 L950 430 M150 465 L150 95" stroke="#64748b" stroke-width="3"/><text x="958" y="438" font-family="sans-serif" font-size="20">camera Z</text><text x="130" y="90" font-family="sans-serif" font-size="20">camera X</text>
<circle cx="220" cy="430" r="12" fill="#ea580c"/><text x="130" y="468" font-family="sans-serif" font-size="18" fill="#c2410c">camera center</text>
<path d="M520 430 L520 125" stroke="#7c3aed" stroke-width="6"/><text x="530" y="130" font-family="sans-serif" font-size="19" fill="#6d28d9">image plane at z = f</text><path d="M520 430 L520 125" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 7"/>
<circle cx="850" cy="160" r="11" fill="#2563eb"/><text x="867" y="165" font-family="sans-serif" font-size="20" fill="#1d4ed8">P = (x,y,z)</text><path d="M220 430 L850 160" stroke="#0f766e" stroke-width="4"/><text x="610" y="258" font-family="sans-serif" font-size="18" fill="#0f766e">ray R(t) = tP</text><circle cx="520" cy="302" r="10" fill="#dc2626"/><text x="536" y="302" font-family="sans-serif" font-size="20" fill="#b91c1c">hit at depth f</text><path d="M220 430 L520 302" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M220 430 L850 430" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/><path d="M520 430 L520 302" stroke="#dc2626" stroke-width="3"/><path d="M220 430 L520 430" stroke="#f59e0b" stroke-width="3"/><text x="365" y="454" font-family="sans-serif" font-size="18" fill="#b45309">f</text><text x="530" y="370" font-family="sans-serif" font-size="18" fill="#b91c1c">yₛ = fy/z</text><text x="535" y="350" font-family="sans-serif" font-size="15" fill="#475569">(horizontal distance is xₛ = fx/z)</text>
<rect x="680" y="330" width="360" height="145" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="710" y="372" font-family="monospace" font-size="21">R(t) = (tx, ty, tz)</text><text x="710" y="412" font-family="monospace" font-size="21">tz = f  ⇒  t = f/z</text><text x="710" y="450" font-family="monospace" font-size="21" fill="#7e22ce">hit = (fx/z, fy/z, f)</text><text x="60" y="530" font-family="sans-serif" font-size="18" fill="#475569">The image coordinate is the ray's intersection with a plane. Farther points have a smaller intersection offset.</text></svg>
