<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
<rect width="820" height="440" fill="#f7f9fc"/><text x="32" y="48" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">Triangle edges determine a perpendicular normal</text>
<path d="M160 320 L520 300 L350 130 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="160" cy="320" r="8" fill="#dc2626"/><circle cx="520" cy="300" r="8" fill="#dc2626"/><circle cx="350" cy="130" r="8" fill="#dc2626"/>
<text x="135" y="350" font-family="sans-serif" font-size="22">A</text><text x="528" y="310" font-family="sans-serif" font-size="22">B</text><text x="350" y="116" font-family="sans-serif" font-size="22">C</text>
<path d="M180 308 L365 145" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="245" y="204" font-family="sans-serif" font-size="20" fill="#15803d">AC</text>
<path d="M180 319 L495 302" stroke="#ea580c" stroke-width="4" marker-end="url(#o)"/><text x="310" y="340" font-family="sans-serif" font-size="20" fill="#c2410c">AB</text>
<path d="M355 245 L365 85" stroke="#7c3aed" stroke-width="5" marker-end="url(#p)"/><text x="374" y="180" font-family="sans-serif" font-size="20" fill="#6d28d9">n = AC × AB</text>
<text x="565" y="165" font-family="monospace" font-size="21" fill="#172033">AB = B − A</text><text x="565" y="205" font-family="monospace" font-size="21" fill="#172033">AC = C − A</text><text x="565" y="265" font-family="monospace" font-size="21" fill="#172033">n ⟂ AB, AC</text><text x="565" y="305" font-family="sans-serif" font-size="17" fill="#475569">Swap B and C and n flips.</text>
<defs><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#16a34a"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#ea580c"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#7c3aed"/></marker></defs></svg>
