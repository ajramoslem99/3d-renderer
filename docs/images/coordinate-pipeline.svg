<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#f8fafc"/><text x="42" y="52" font-family="sans-serif" font-size="31" font-weight="700" fill="#172033">One vertex, described in four coordinate spaces</text>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#475569"/></marker></defs>
<g font-family="sans-serif" fill="#172033"><text x="60" y="112" font-size="22" font-weight="700">1 · object space</text><text x="345" y="112" font-size="22" font-weight="700">2 · world space</text><text x="635" y="112" font-size="22" font-weight="700">3 · camera space</text><text x="935" y="112" font-size="22" font-weight="700">4 · image / pixels</text></g>
<!-- object axes and point -->
<g transform="translate(105 330)"><path d="M0 0 L130 0 M0 0 L0 -125 M0 0 L-65 62" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><text x="138" y="7" font-family="sans-serif" font-size="18">x</text><text x="-10" y="-135" font-family="sans-serif" font-size="18">y</text><text x="-80" y="78" font-family="sans-serif" font-size="18">z</text><path d="M0 0 L74 -65" stroke="#2563eb" stroke-width="4"/><circle cx="74" cy="-65" r="9" fill="#2563eb"/><text x="80" y="-72" font-family="sans-serif" font-size="18" fill="#1d4ed8">pₒ</text><path d="M-20 -15 L90 -90 L115 -45 L5 20 Z" fill="#dbeafe" fill-opacity=".65" stroke="#60a5fa" stroke-width="2"/></g>
<path d="M230 325 L310 325" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/><text x="228" y="285" font-family="monospace" font-size="16">rotate + translate</text><text x="250" y="354" font-family="monospace" font-size="16">pʷ = R pₒ + t</text>
<!-- world -->
<g transform="translate(385 330)"><path d="M0 0 L130 0 M0 0 L0 -125 M0 0 L-65 62" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><text x="138" y="7" font-family="sans-serif" font-size="18">x</text><text x="-10" y="-135" font-family="sans-serif" font-size="18">y</text><text x="-80" y="78" font-family="sans-serif" font-size="18">z</text><path d="M0 0 L74 -65" stroke="#16a34a" stroke-width="4"/><circle cx="74" cy="-65" r="9" fill="#16a34a"/><text x="80" y="-72" font-family="sans-serif" font-size="18" fill="#15803d">pʷ</text><circle cx="-35" cy="18" r="9" fill="#ea580c"/><text x="-56" y="45" font-family="sans-serif" font-size="16" fill="#c2410c">camera c</text><path d="M-35 18 L74 -65" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 6"/></g>
<path d="M520 325 L600 325" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/><text x="524" y="285" font-family="monospace" font-size="16">subtract camera</text><text x="552" y="354" font-family="monospace" font-size="16">pᶜ = pʷ − c</text>
<!-- camera -->
<g transform="translate(685 330)"><path d="M0 0 L130 0 M0 0 L0 -125 M0 0 L-65 62" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><text x="138" y="7" font-family="sans-serif" font-size="18">right</text><text x="-10" y="-135" font-family="sans-serif" font-size="18">up</text><text x="-92" y="78" font-family="sans-serif" font-size="18">−forward</text><path d="M0 0 L100 -80" stroke="#16a34a" stroke-width="4"/><circle cx="100" cy="-80" r="9" fill="#16a34a"/><text x="106" y="-86" font-family="sans-serif" font-size="18" fill="#15803d">pᶜ</text><path d="M0 0 L100 -80" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 6"/></g>
<path d="M820 325 L905 325" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/><text x="823" y="285" font-family="monospace" font-size="16">divide by depth</text><text x="842" y="354" font-family="monospace" font-size="16">(fx/z, fy/z)</text>
<!-- image plane -->
<g transform="translate(1000 200)"><rect x="0" y="0" width="150" height="250" fill="#fff" stroke="#7c3aed" stroke-width="4"/><path d="M75 125 L112 92" stroke="#dc2626" stroke-width="4"/><circle cx="112" cy="92" r="8" fill="#dc2626"/><path d="M75 125 L75 0 M75 125 L150 125" stroke="#94a3b8" stroke-width="2"/><text x="85" y="82" font-family="sans-serif" font-size="18" fill="#b91c1c">(xₛ,yₛ)</text><text x="37" y="145" font-family="sans-serif" font-size="16">center</text><text x="19" y="282" font-family="sans-serif" font-size="18">add (W/2,H/2)</text></g>
<rect x="46" y="495" width="1105" height="105" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="74" y="535" font-family="sans-serif" font-size="20" font-weight="700" fill="#172033">Same point, new coordinates</text><text x="74" y="572" font-family="sans-serif" font-size="19" fill="#475569">The geometry is continuous; each stage changes the origin, axes, or representation. Projection is the special step that loses depth.</text>
</svg>
