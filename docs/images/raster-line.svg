<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"><rect width="900" height="450" fill="#f7f9fc"/><text x="30" y="45" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">DDA line steps and row-major pixel storage</text>
<g transform="translate(55 95)"><path d="M0 0 H350 M0 50 H350 M0 100 H350 M0 150 H350 M0 200 H350 M0 250 H350 M0 0 V250 M50 0 V250 M100 0 V250 M150 0 V250 M200 0 V250 M250 0 V250 M300 0 V250 M350 0 V250" stroke="#cbd5e1" stroke-width="1"/><path d="M50 200 L300 50" stroke="#2563eb" stroke-width="4"/><g fill="#dc2626"><circle cx="50" cy="200" r="7"/><circle cx="100" cy="170" r="7"/><circle cx="150" cy="140" r="7"/><circle cx="200" cy="110" r="7"/><circle cx="250" cy="80" r="7"/><circle cx="300" cy="50" r="7"/></g><text x="2" y="285" font-family="sans-serif" font-size="17">N = max(|Δx|, |Δy|); step = (Δx/N, Δy/N)</text></g>
<g transform="translate(485 105)" font-family="monospace" font-size="18"><text x="0" y="0">row y=0: 0  1  2  3  4  5</text><text x="0" y="42">row y=1: 6  7  8  9 10 11</text><text x="0" y="84">row y=2: 12 13 14 15 16 17</text><text x="0" y="150" font-family="sans-serif" font-size="19">index = y × width + x</text><text x="0" y="190" font-family="sans-serif" font-size="17" fill="#475569">Each row starts width pixels later.</text><rect x="0" y="225" width="330" height="95" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="263">bounds: 0 ≤ x &lt; W</text><text x="18" y="295">         0 ≤ y &lt; H</text></g></svg>
