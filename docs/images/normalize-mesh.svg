<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"><rect width="900" height="390" fill="#f7f9fc"/><text x="30" y="45" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">Normalize a mesh in three steps</text>
<g font-family="sans-serif" fill="#172033"><text x="68" y="92" font-size="20" font-weight="700">1. Find bounds and midpoint</text><text x="350" y="92" font-size="20" font-weight="700">2. Center: v − c</text><text x="636" y="92" font-size="20" font-weight="700">3. Scale: v / r</text></g>
<rect x="70" y="125" width="200" height="155" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><path d="M125 245 L175 150 L225 230 L150 270 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><path d="M70 125 L270 280 M270 125 L70 280" stroke="#94a3b8" stroke-dasharray="6 5"/><circle cx="170" cy="202" r="6" fill="#dc2626"/><text x="83" y="310" font-family="monospace" font-size="17">c = (min + max) / 2</text>
<path d="M365 203 L555 203" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><circle cx="460" cy="203" r="76" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><path d="M424 245 L460 159 L501 230 L449 258 Z" fill="#bef264" stroke="#4d7c0f" stroke-width="3"/><circle cx="460" cy="203" r="5" fill="#dc2626"/><text x="386" y="310" font-family="monospace" font-size="17">centered origin at c</text>
<circle cx="745" cy="203" r="76" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><path d="M709 245 L745 159 L786 230 L734 258 Z" fill="#d8b4fe" stroke="#7e22ce" stroke-width="3"/><circle cx="745" cy="203" r="5" fill="#dc2626"/><text x="650" y="310" font-family="monospace" font-size="17">r = max distance from c</text><text x="330" y="358" font-family="sans-serif" font-size="17" fill="#475569">Shape proportions stay fixed; the farthest vertex ends at radius 1.</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs></svg>
