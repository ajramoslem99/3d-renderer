<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" fill="#f8fafc"/><text x="34" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#172033">Perspective scale: distance changes size, a camera ray keeps its pixel</text>
<path d="M145 430 L720 430 M160 455 L160 90" stroke="#64748b" stroke-width="3"/><text x="730" y="438" font-family="sans-serif" font-size="18">depth</text><circle cx="190" cy="430" r="11" fill="#ea580c"/><text x="120" y="470" font-family="sans-serif" font-size="17">camera</text><path d="M190 430 L700 150" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 7"/><text x="420" y="250" font-family="sans-serif" font-size="18" fill="#0f766e">one ray from the pinhole</text>
<!-- plane --> <path d="M590 115 L590 445" stroke="#7c3aed" stroke-width="5"/><text x="600" y="126" font-family="sans-serif" font-size="17" fill="#6d28d9">image plane</text>
<!-- equal ray points --> <circle cx="340" cy="348" r="10" fill="#2563eb"/><circle cx="520" cy="249" r="10" fill="#2563eb"/><text x="272" y="337" font-family="sans-serif" font-size="17" fill="#1d4ed8">P₁=(1,1,2)</text><text x="457" y="235" font-family="sans-serif" font-size="17" fill="#1d4ed8">P₂=(2,2,4)</text><circle cx="590" cy="210" r="9" fill="#dc2626"/><path d="M340 348 L590 210 M520 249 L590 210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><text x="606" y="214" font-family="sans-serif" font-size="16" fill="#b91c1c">same image point</text>
<!-- size comparison --> <rect x="790" y="135" width="255" height="290" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="820" y="175" font-family="sans-serif" font-size="20" font-weight="700">Same-size cubes</text><path d="M842 270 l34 -20 34 20 -34 20 z M842 270 v43 l34 20 v-43 M910 270 v43 l-34 20" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><path d="M950 230 l17 -10 17 10 -17 10 z M950 230 v22 l17 10 v-22 M984 230 v22 l-17 10" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><text x="836" y="374" font-family="sans-serif" font-size="17">near → larger image</text><text x="836" y="402" font-family="sans-serif" font-size="17">far → smaller image</text>
<rect x="70" y="495" width="975" height="42" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="95" y="523" font-family="monospace" font-size="20">(x₁/z₁, y₁/z₁) = (x₂/z₂, y₂/z₂) ⇒ same pixel; depth is still different</text></svg>
