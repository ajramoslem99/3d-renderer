<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"><rect width="820" height="440" fill="#f7f9fc"/><text x="32" y="48" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">Rotate around X: the YZ cross-section turns</text>
<path d="M170 340 L170 115 M170 340 L440 340" stroke="#64748b" stroke-width="2"/><text x="150" y="105" font-family="sans-serif" font-size="18">z</text><text x="450" y="347" font-family="sans-serif" font-size="18">y</text>
<circle cx="170" cy="340" r="6" fill="#111827"/><path d="M170 340 L170 180" stroke="#2563eb" stroke-width="5"/><circle cx="170" cy="180" r="8" fill="#2563eb"/><text x="100" y="195" font-family="sans-serif" font-size="18" fill="#1d4ed8">(y,z)</text>
<path d="M170 340 A160 160 0 0 1 305 254" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/><path d="M170 340 L305 254" stroke="#dc2626" stroke-width="5"/><circle cx="305" cy="254" r="8" fill="#dc2626"/><text x="315" y="250" font-family="sans-serif" font-size="18" fill="#b91c1c">(y′,z′)</text><text x="220" y="275" font-family="sans-serif" font-size="20" fill="#b45309">θ</text>
<rect x="485" y="120" width="300" height="205" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="510" y="165" font-family="monospace" font-size="21">x′ = x</text><text x="510" y="210" font-family="monospace" font-size="21">y′ = y cos θ − z sin θ</text><text x="510" y="255" font-family="monospace" font-size="21">z′ = y sin θ + z cos θ</text><text x="510" y="295" font-family="sans-serif" font-size="17" fill="#475569">x is unchanged; the YZ plane rotates.</text></svg>
