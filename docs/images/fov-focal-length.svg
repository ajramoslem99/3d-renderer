<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" fill="#f8fafc"/><text x="34" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#172033">Field of view and focal scale are two ways to describe the same camera</text>
<path d="M180 390 L770 390" stroke="#64748b" stroke-width="3"/><circle cx="190" cy="390" r="12" fill="#ea580c"/><text x="110" y="426" font-family="sans-serif" font-size="18">camera / pinhole</text>
<path d="M610 140 L610 390" stroke="#7c3aed" stroke-width="6"/><text x="620" y="155" font-family="sans-serif" font-size="18" fill="#6d28d9">image plane</text><path d="M610 140 L610 390" stroke="#7c3aed" stroke-width="2"/>
<path d="M190 390 L610 140 M190 390 L610 390" stroke="#2563eb" stroke-width="4"/><path d="M275 390 A85 85 0 0 0 264 345" fill="none" stroke="#f59e0b" stroke-width="5"/><text x="282" y="357" font-family="sans-serif" font-size="22" fill="#b45309">α/2</text><path d="M595 140 L595 390" stroke="#dc2626" stroke-width="3"/><text x="565" y="275" font-family="sans-serif" font-size="18" fill="#b91c1c">f</text><path d="M610 140 L680 140 M610 390 L680 390" stroke="#64748b" stroke-width="2"/><text x="685" y="275" font-family="sans-serif" font-size="18">H/2</text>
<rect x="720" y="190" width="230" height="150" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="747" y="233" font-family="monospace" font-size="20">tan(α/2)</text><text x="747" y="270" font-family="monospace" font-size="20">= (H/2)/f</text><text x="747" y="315" font-family="monospace" font-size="20" fill="#7e22ce">f = (H/2)/tan(α/2)</text><text x="100" y="475" font-family="sans-serif" font-size="18" fill="#475569">Wider α → shorter f → more of the scene fits, with stronger perspective size change.</text></svg>
