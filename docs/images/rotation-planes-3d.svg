<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="1100" height="600" fill="#f8fafc"/><text x="34" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#172033">Each principal 3D rotation is a 2D turn in a perpendicular slice</text>
<g font-family="sans-serif" fill="#172033"><text x="90" y="100" font-size="23" font-weight="700">Turn around X</text><text x="445" y="100" font-size="23" font-weight="700">Turn around Y</text><text x="800" y="100" font-size="23" font-weight="700">Turn around Z</text></g>
<!-- X --> <g transform="translate(210 320)"><ellipse cx="0" cy="0" rx="130" ry="84" fill="#dbeafe" fill-opacity=".8" stroke="#2563eb" stroke-width="3"/><path d="M-155 0 L155 0" stroke="#dc2626" stroke-width="4"/><text x="-25" y="-103" font-family="sans-serif" font-size="18" fill="#1d4ed8">YZ plane</text><text x="160" y="8" font-family="sans-serif" font-size="18" fill="#b91c1c">X axis</text><path d="M0 0 L75 -58" stroke="#334155" stroke-width="4"/><path d="M0 0 L102 15" stroke="#16a34a" stroke-width="4"/><path d="M25 -18 A34 34 0 0 1 32 5" fill="none" stroke="#f59e0b" stroke-width="4"/><text x="-8" y="30" font-family="sans-serif" font-size="18">x stays fixed</text></g>
<!-- Y --> <g transform="translate(560 320)"><ellipse cx="0" cy="0" rx="130" ry="84" fill="#dcfce7" fill-opacity=".8" stroke="#16a34a" stroke-width="3"/><path d="M0 -125 L0 125" stroke="#dc2626" stroke-width="4"/><text x="-45" y="-103" font-family="sans-serif" font-size="18" fill="#15803d">XZ plane</text><text x="12" y="132" font-family="sans-serif" font-size="18" fill="#b91c1c">Y axis</text><path d="M0 0 L82 -50" stroke="#334155" stroke-width="4"/><path d="M0 0 L100 5" stroke="#16a34a" stroke-width="4"/><path d="M27 -16 A34 34 0 0 1 34 5" fill="none" stroke="#f59e0b" stroke-width="4"/><text x="-34" y="30" font-family="sans-serif" font-size="18">y stays fixed</text></g>
<!-- Z --> <g transform="translate(910 320)"><ellipse cx="0" cy="0" rx="130" ry="84" fill="#f3e8ff" fill-opacity=".8" stroke="#9333ea" stroke-width="3"/><path d="M-150 -75 L150 75" stroke="#dc2626" stroke-width="4"/><text x="-45" y="-103" font-family="sans-serif" font-size="18" fill="#7e22ce">XY plane</text><text x="90" y="105" font-family="sans-serif" font-size="18" fill="#b91c1c">Z axis</text><path d="M0 0 L82 -49" stroke="#334155" stroke-width="4"/><path d="M0 0 L101 8" stroke="#16a34a" stroke-width="4"/><path d="M26 -16 A34 34 0 0 1 34 7" fill="none" stroke="#f59e0b" stroke-width="4"/><text x="-34" y="30" font-family="sans-serif" font-size="18">z stays fixed</text></g>
<rect x="60" y="485" width="980" height="75" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="85" y="518" font-family="monospace" font-size="20">Rx rotates (y,z)   ·   Ry rotates (x,z)   ·   Rz rotates (x,y)</text><text x="85" y="545" font-family="sans-serif" font-size="17" fill="#475569">The unchanged coordinate names the axis; the other two coordinates form the 2D rotation plane.</text></svg>
