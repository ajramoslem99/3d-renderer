<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" fill="#f7f9fc"/><text x="30" y="45" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">Similar triangles turn camera coordinates into screen offsets</text>
<path d="M145 350 L740 350 M190 390 L190 90" stroke="#64748b" stroke-width="2"/><text x="750" y="357" font-family="sans-serif" font-size="18">z</text><text x="165" y="85" font-family="sans-serif" font-size="18">x</text><circle cx="190" cy="350" r="8" fill="#dc2626"/><text x="116" y="382" font-family="sans-serif" font-size="17">camera / pinhole</text>
<path d="M570 350 L570 160" stroke="#2563eb" stroke-width="5"/><text x="578" y="180" font-family="sans-serif" font-size="18" fill="#1d4ed8">projection plane</text><circle cx="700" cy="115" r="8" fill="#ea580c"/><text x="714" y="120" font-family="sans-serif" font-size="18">point (x,z)</text><path d="M190 350 L700 115" stroke="#0f766e" stroke-width="3"/><path d="M190 350 L570 175" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 6"/><path d="M570 350 L570 175" stroke="#dc2626" stroke-width="3"/><path d="M190 350 L570 350" stroke="#7c3aed" stroke-width="3"/><text x="355" y="376" font-family="sans-serif" font-size="18" fill="#6d28d9">f</text><text x="580" y="285" font-family="sans-serif" font-size="18" fill="#b91c1c">xₛ</text><text x="425" y="235" font-family="sans-serif" font-size="18" fill="#0f766e">similar triangles</text>
<rect x="330" y="78" width="225" height="72" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="360" y="122" font-family="monospace" font-size="24">xₛ / f = x / z</text><rect x="590" y="185" width="275" height="135" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="615" y="230" font-family="monospace" font-size="22">xₛ = f · x / z</text><text x="615" y="270" font-family="monospace" font-size="22">yₛ = f · y / z</text><text x="615" y="300" font-family="sans-serif" font-size="16" fill="#475569">larger z makes the image smaller</text></svg>
