<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440"><rect width="860" height="440" fill="#f7f9fc"/><text x="30" y="45" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">Back-face culling uses the sign of a dot product</text>
<path d="M180 310 L420 290 L305 145 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="180" cy="310" r="7" fill="#dc2626"/><text x="160" y="340" font-family="sans-serif" font-size="18">A</text><path d="M310 245 L320 105" stroke="#7c3aed" stroke-width="5" marker-end="url(#m)"/><text x="330" y="150" font-family="sans-serif" font-size="19" fill="#6d28d9">unit normal n</text><path d="M80 100 L180 310" stroke="#ea580c" stroke-width="4" marker-end="url(#q)"/><circle cx="80" cy="100" r="9" fill="#ea580c"/><text x="45" y="82" font-family="sans-serif" font-size="18">camera</text><text x="90" y="220" font-family="sans-serif" font-size="18" fill="#c2410c">v = A − camera</text>
<rect x="485" y="110" width="330" height="220" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="515" y="160" font-family="monospace" font-size="24">d = n · v</text><text x="515" y="210" font-family="sans-serif" font-size="19">d &lt; 0 → skip this face</text><text x="515" y="250" font-family="sans-serif" font-size="18">d ≥ 0 → keep this face</text><text x="515" y="296" font-family="sans-serif" font-size="16" fill="#475569">The rule depends on winding and normal direction.</text><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#7c3aed"/></marker><marker id="q" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#ea580c"/></marker></defs></svg>
