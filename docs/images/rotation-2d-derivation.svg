<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" fill="#f8fafc"/><text x="34" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#172033">A rotation is a radius split into horizontal and vertical components</text>
<path d="M100 430 L520 430 M130 460 L130 95" stroke="#64748b" stroke-width="3"/><text x="528" y="438" font-family="sans-serif" font-size="20">x</text><text x="117" y="88" font-family="sans-serif" font-size="20">y</text>
<path d="M130 430 L410 150" stroke="#2563eb" stroke-width="6"/><circle cx="410" cy="150" r="10" fill="#2563eb"/><text x="425" y="148" font-family="sans-serif" font-size="22" fill="#1d4ed8">(x,y)</text><path d="M130 430 L410 430 L410 150" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/><text x="260" y="460" font-family="sans-serif" font-size="19">x = r cos φ</text><text x="420" y="300" font-family="sans-serif" font-size="19">y = r sin φ</text>
<path d="M230 430 A100 100 0 0 1 300 360" fill="none" stroke="#f59e0b" stroke-width="4"/><text x="255" y="395" font-family="sans-serif" font-size="23" fill="#b45309">φ</text><path d="M410 150 A280 280 0 0 1 480 235" fill="none" stroke="#f59e0b" stroke-width="4"/><path d="M130 430 L480 235" stroke="#dc2626" stroke-width="6"/><circle cx="480" cy="235" r="10" fill="#dc2626"/><text x="494" y="238" font-family="sans-serif" font-size="22" fill="#b91c1c">(x′,y′)</text><text x="445" y="200" font-family="sans-serif" font-size="23" fill="#b45309">θ</text>
<path d="M480 235 L480 430 M130 430 L480 430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><text x="270" y="505" font-family="sans-serif" font-size="18" fill="#b91c1c">x′ = r cos(φ + θ)</text><text x="495" y="344" font-family="sans-serif" font-size="18" fill="#b91c1c">y′ = r sin(φ + θ)</text>
<rect x="650" y="105" width="410" height="365" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="685" y="155" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Use angle-sum identities</text><text x="685" y="210" font-family="monospace" font-size="20">cos(φ + θ) = cosφ cosθ</text><text x="848" y="240" font-family="monospace" font-size="20">− sinφ sinθ</text><text x="685" y="300" font-family="monospace" font-size="20">sin(φ + θ) = sinφ cosθ</text><text x="848" y="330" font-family="monospace" font-size="20">+ cosφ sinθ</text><path d="M685 355 L1020 355" stroke="#e2e8f0" stroke-width="2"/><text x="685" y="395" font-family="monospace" font-size="19" fill="#1d4ed8">x′ = x cosθ − y sinθ</text><text x="685" y="435" font-family="monospace" font-size="19" fill="#b91c1c">y′ = x sinθ + y cosθ</text><text x="78" y="540" font-family="sans-serif" font-size="18" fill="#475569">Radius r is unchanged, so rotation changes direction while preserving distance to the origin.</text></svg>
