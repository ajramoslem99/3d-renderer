<svg xmlns="http://www.w3.org/2000/svg" width="820" height="510" viewBox="0 0 820 510"><rect width="820" height="440" fill="#f7f9fc"/><text x="32" y="48" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">Rotate around Y: the XZ cross-section turns</text>
<path d="M170 340 L170 115 M170 340 L440 340" stroke="#64748b" stroke-width="2"/><text x="150" y="105" font-family="sans-serif" font-size="18">z</text><text x="450" y="347" font-family="sans-serif" font-size="18">x</text>
<path d="M170 340 L330 340" stroke="#2563eb" stroke-width="5"/><circle cx="330" cy="340" r="8" fill="#2563eb"/><text x="330" y="370" font-family="sans-serif" font-size="18" fill="#1d4ed8">(x,z)</text>
<path d="M170 340 A160 160 0 0 1 282 454" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/><path d="M170 340 L282 454" stroke="#dc2626" stroke-width="5"/><circle cx="282" cy="454" r="8" fill="#dc2626"/><text x="292" y="460" font-family="sans-serif" font-size="18" fill="#b91c1c">(x′,z′)</text><text x="220" y="385" font-family="sans-serif" font-size="20" fill="#b45309">θ</text>
<rect x="485" y="120" width="300" height="205" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="510" y="165" font-family="monospace" font-size="21">x′ = x cos θ + z sin θ</text><text x="510" y="210" font-family="monospace" font-size="21">y′ = y</text><text x="510" y="255" font-family="monospace" font-size="21">z′ = −x sin θ + z cos θ</text><text x="510" y="295" font-family="sans-serif" font-size="17" fill="#475569">y is unchanged; the XZ plane rotates.</text></svg>
